env {
  execution.parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  read_limit.bytes_per_second = 7000000
  read_limit.rows_per_second = 400
}

source {
  Postgres-CDC {
    plugin_output = "customers_postgres_cdc"
    username = "postgres"
    password = "postgres"
    database-names = ["postgres_cdc"]
    schema-names = ["inventory"]
    table-names = ["postgres_cdc.inventory.postgres_cdc_table_1"]
    url = "jdbc:postgresql://postgres_cdc_e2e:5432/postgres_cdc?loggerLevel=OFF"
    decoding.plugin.name = "pgoutput"
    slot.name = ${slot_name}
    sslmode = "disable"
    publication.name = ${publication_name}
    publication.autocreate.mode = "all_tables"
    heartbeat.interval.ms = 1000
    connect.max-retries = 1
  }
}

sink {
  jdbc {
    plugin_input = "customers_postgres_cdc"
    url = "jdbc:postgresql://postgres_cdc_e2e:5432/postgres_cdc?loggerLevel=OFF&ApplicationName=seatunnel_jdbc_sink"
    driver = "org.postgresql.Driver"
    user = "postgres"
    password = "postgres"
    generate_sink_sql = true
    database = postgres_cdc
    table = inventory.sink_postgres_cdc_table_1
    primary_keys = ["id"]
  }
}
